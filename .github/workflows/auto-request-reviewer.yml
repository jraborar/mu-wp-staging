name: Auto-request reviewer on PR open

on:
  pull_request:
    types: [opened]

jobs:
  request-reviewer:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const reviewer = 'jasper100777'
            const author   = context.payload.pull_request.user.login

            if (author === reviewer) {
              console.log(`PR author is ${reviewer} — skipping self-request.`)
              return
            }

            await github.rest.pulls.requestReviewers({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers:   [reviewer],
            })

            console.log(`Requested ${reviewer} as reviewer on PR #${context.payload.pull_request.number}`)
